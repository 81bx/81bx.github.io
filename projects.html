<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <link rel="icon" href="icon.jpg" type="image/jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>81bx - Projects</title>

  <style>
    * {
      box-sizing: border-box;
        margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
       display: flex;
        align-items: center;
          justify-content: center;
        font-family: Inter, Arial, sans-serif;
       background: #ff00bf;
      background: linear-gradient(334deg, rgba(255, 0, 191, 1) 0%, rgba(144, 0, 254, 1) 36%, rgba(0, 98, 255, 1) 75%, rgba(0, 255, 229, 1) 100%);
      color: #f9fbfe;
    }

    .card {
         width: min(90%, 500px);
        background: #ff00bf;
       background: linear-gradient(152deg, rgba(255, 0, 191, 1) 0%, rgba(144, 0, 254, 1) 36%, rgba(0, 98, 255, 1) 75%, rgba(0, 255, 229, 1) 100%);
      border-radius: 24px;
       padding: 50px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
         text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 30px;
    }

    p {
      margin-bottom: 30px;
      color: #f4f4f5;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
        display: block;
       width: 100%;
        padding: 14px 20px;
         border-radius: 30px;
        font-size: 16px;
         font-weight: 600;
        text-decoration: none;
         text-align: center;
        cursor: pointer;
         transition: 0.2s ease;
    }

    .primary {
  background: #00000000;
  color: white;
    }

    .primary:hover {
      background: #00000000;
      transform: translateY(-2px);
    }

    .outline {
      background: transparent;
      color: #333434;
      border: 1px solid #d1d5db;
    }

    .outline:hover {
      background: #f9fafb;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    selector {
  property: value;
}

  </style>
</head>

<body>
  <div class="card">

    <div class="buttons">
    <h1>Welcome to my projects that I build!</h1>

   <a class="button primary" href="https://github.com/81bx/NRPM-Desktop">
    NRPM Desktop
  </a>

   <a class="button primary" href="https://tikatprotocool.github.io">
    TikATProtocool
  </a>
      
   <a class="button primary" href="https://krmsclient.github.io">
    KRMS Modpack website
  </a>

    </div>
  </div>

</body>
</html>
