<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="icon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>81bx - Social Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      background: #a210af;
      color: #f9fbfe;
    }

    .card {
      width: min(90%, 500px);
      background: #27043f;
      border-radius: 24px;
      padding: 50px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 30px;
    }

    p {
      margin-bottom: 30px;
      color: #f4f4f5;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .primary {
  background: #27043f;
  color: white;
    }

    .primary:hover {
      background: #27043f;
      transform: translateY(-2px);
    }

    .secondary {
      background: #27043f;
      color: #ffffff;
    }

    .secondary:hover {
      background: #27043f;
      transform: translateY(-2px);
    }

    .outline {
      background: transparent;
      color: #333434;
      border: 1px solid #d1d5db;
    }

    .outline:hover {
      background: #f9fafb;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    selector {
  property: value;
}

  </style>
</head>

<body>
  <div class="card">

    <div class="buttons">
    <h1>Welcome to my website!</h1>
    <h2>About Me:</h2>
    <p>I build something else like OldFetch Linux fork and hinnkaDistro for chroot post-installtion.</p>
    <h2>My socials:</h2>
    
   <a class="button secondary" href="https://github.com/81bx">
    GitHub
  </a>

   <a class="button secondary" href="https://twitch.tv/u1ym">
    Twitch
  </a>

   <a class="button secondary" href="https://youtube.com/@81bx">
    YouTube
  </a>

    </div>
  </div>

</body>
</html>
